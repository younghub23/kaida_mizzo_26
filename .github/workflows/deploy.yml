name: Deploy to Cloudflare Workers

# Publishes the app to Cloudflare Workers (via OpenNext) on every push to main,
# so "push to main" == "go live". Can also be triggered manually from the
# Actions tab via the "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; if a new push lands mid-deploy, cancel the
# in-flight run so the latest commit is what ends up live.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy to Cloudflare
        # Runs `opennextjs-cloudflare build && opennextjs-cloudflare deploy`.
        # wrangler reads CLOUDFLARE_API_TOKEN from the environment to authenticate.
        run: npm run deploy
        env:
          # --- Cloudflare auth (required) ---
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only needed if your API token has access to more than one account.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          # --- Build-time public vars (required) ---
          # Next.js inlines NEXT_PUBLIC_* values into the bundle AT BUILD TIME,
          # so they must be present here in CI — Worker secrets are not enough.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

          # --- Build-time public vars (optional) ---
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_ANALYTICS_ALLOW_MOCK: ${{ secrets.NEXT_PUBLIC_ANALYTICS_ALLOW_MOCK }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

          # NOTE: Server-only secrets (SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY,
          # STRIPE_SECRET_KEY, STRIPE_*_PRICE_ID, META_*, LINKEDIN_*, TIKTOK_*,
          # GOOGLE_*, RESEND_API_KEY) are RUNTIME values. Set those once as Worker
          # secrets via `wrangler secret put <NAME>` or the Cloudflare dashboard —
          # they do not belong here.
