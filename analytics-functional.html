<!--
  ============================================================================
  ANALYTICS PAGE — FUNCTIONALITY-ONLY SCAFFOLD
  ----------------------------------------------------------------------------
  This file is a self-contained, dependency-free port of the /analytics page's
  *behaviour* so you can tinker with the aesthetic layout in Claude design.

  It contains NO design choices on purpose:
    • no colours, fonts, gradients, shadows, spacing systems
    • the only CSS below is the bare minimum structural plumbing needed for the
      interactive bits to read as data (bar widths, heatmap cells, the line
      chart). Replace all of it with your design.

  What IS here is every piece of *functionality* the real page has, ported
  faithfully from the codebase (mock-data.ts, load.ts, cross-channel.ts, the
  section components and the format/plan helpers):

    1.  Cross-network filter that drives every section below
    2.  Data-source state (mock / empty) → banner + per-section empty states
    3.  Plan tier selector → social-listening lock/unlock gate
    4.  Core KPI cards (per-network values + deltas) + engagement/reach trend
    5.  Top content (top 3 by engagement rate)
    6.  Content performance (sortable per-post table)
    7.  Audience insights (locations, ages, gender, active-hours heatmap,
        follower growth)
    8.  Cross-channel followers (real deterministic identity matcher)
    9.  Best time to post (per-network windows)
    10. Competitor benchmark (table + share of voice)
    11. ROI / conversion attribution (filtered table with totals)
    12. Custom report builder (widget toggles, white-label, export)
    13. Social listening & sentiment (plan-gated locked/unlocked states)

  Every element carries a descriptive class so you can target it when styling.
  ============================================================================
-->

<style>
  /* ----------------------------------------------------------------------
     MINIMAL STRUCTURAL CSS ONLY — not a design. Delete / replace freely.
     Kept neutral (no colour/typography choices) so the data stays legible.
     ---------------------------------------------------------------------- */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.4; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 1rem; }
  section { margin: 1.5rem 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid; }
  th button { font: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  [hidden] { display: none !important; }

  /* Data-driven primitives (widths/heights encode VALUES, not aesthetics). */
  .bar-track { display: inline-block; width: 160px; height: 10px; border: 1px solid; vertical-align: middle; }
  .bar-fill { display: block; height: 100%; background: currentColor; }
  .col-chart { display: flex; align-items: flex-end; gap: 4px; height: 100px; }
  .col-chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .col-chart .col > span:first-child { width: 100%; background: currentColor; }
  .heatmap-row { display: flex; align-items: center; gap: 4px; }
  .heatmap-cells { display: flex; flex: 1; gap: 1px; }
  .heatmap-cells > span { flex: 1; height: 14px; outline: 1px solid rgba(0,0,0,.08); }
  .line-chart svg { width: 100%; height: 160px; border: 1px solid; }

  /* Active state on the network filter / sort headers, expressed structurally. */
  [aria-pressed="true"], [aria-sort] button[data-active="true"] { font-weight: 700; text-decoration: underline; }

  .controls label { margin-right: 1rem; }
  .source-badge::before { content: "Source: "; }
</style>

// ── Networks (drives the cross-network unified-reporting filter) ──
const NETWORKS = [
  { id: 'all', label: 'All' },
  { id: 'instagram', label: 'Instagram' },
  { id: 'facebook', label: 'Facebook' },
  { id: 'linkedin', label: 'LinkedIn' },
  { id: 'tiktok', label: 'TikTok' },
  { id: 'youtube', label: 'YouTube' },
  { id: 'pinterest', label: 'Pinterest' },
  { id: 'snapchat', label: 'Snapchat' },
  { id: 'google', label: 'Google' },
];
const REAL_NETWORKS = ['instagram','facebook','linkedin','tiktok','youtube','pinterest','snapchat','google'];
const NETWORK_LABEL = {
  instagram:'Instagram', facebook:'Facebook', linkedin:'LinkedIn', tiktok:'TikTok',
  youtube:'YouTube', pinterest:'Pinterest', snapchat:'Snapchat', google:'Google',
};

const NETWORK_WEIGHT = { instagram:0.26, facebook:0.16, linkedin:0.1, tiktok:0.18, youtube:0.13, pinterest:0.08, snapchat:0.04, google:0.05 };
const NETWORK_DELTA_BIAS = { instagram:2, facebook:-3, linkedin:1, tiktok:5, youtube:3, pinterest:1, snapchat:-2, google:-4 };

// Deterministic PRNG (LCG) so per-network generated series are stable.
function seeded(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0xffffffff; };
}
function networkSeed(network) {
  const idx = NETWORKS.findIndex(n => n.id === network);
  return (idx + 1) * 97;
}

// ── 1. Core performance metrics ──
const BASE_KPIS = {
  engagementRate: { label:'Engagement rate', format:'percent', value:4.8,   deltaPct:12.4, additive:false },
  followers:      { label:'Followers',       format:'number',  value:24800, deltaPct:3.4,  additive:true  },
  reach:          { label:'Reach',           format:'number',  value:184200,deltaPct:8.1,  additive:true  },
  followerGrowth: { label:'Follower growth', format:'number',  value:3240,  deltaPct:18.6, additive:true  },
  impressions:    { label:'Impressions',     format:'number',  value:412800,deltaPct:5.3,  additive:true  },
  likes:          { label:'Likes',           format:'number',  value:28940, deltaPct:9.7,  additive:true  },
  comments:       { label:'Comments',        format:'number',  value:3120,  deltaPct:-2.4, additive:true  },
  shares:         { label:'Shares',          format:'number',  value:1860,  deltaPct:14.2, additive:true  },
  clicks:         { label:'Clicks',          format:'number',  value:9450,  deltaPct:6.8,  additive:true  },
};
const NETWORK_ENGAGEMENT_RATE = { instagram:5.6, facebook:3.2, linkedin:4.1, tiktok:7.3, youtube:2.4, pinterest:1.6, snapchat:3.0, google:1.9 };

function biasedDelta(base, network) {
  if (network === 'all') return base;
  return Math.round((base + NETWORK_DELTA_BIAS[network]) * 10) / 10;
}
function getCoreMetrics(network) {
  return Object.keys(BASE_KPIS).map(key => {
    const spec = BASE_KPIS[key];
    let value = spec.value;
    if (network !== 'all') {
      if (key === 'engagementRate') value = NETWORK_ENGAGEMENT_RATE[network];
      else if (spec.additive) value = Math.round(spec.value * NETWORK_WEIGHT[network]);
    }
    return { key, label: spec.label, value, format: spec.format, deltaPct: biasedDelta(spec.deltaPct, network) };
  });
}

// ── 1b. Trend chart (last 30 days) ──
const END_DATE = new Date('2026-06-22T00:00:00Z');
function lastNDateLabels(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(END_DATE);
    d.setUTCDate(d.getUTCDate() - i);
    out.push(`${d.getUTCMonth() + 1}/${d.getUTCDate()}`);
  }
  return out;
}
function getTrend(network) {
  const labels = lastNDateLabels(30);
  const rand = seeded(networkSeed(network));
  const scale = network === 'all' ? 1 : NETWORK_WEIGHT[network];
  const baseEngagement = 920 * scale;
  const baseReach = 6100 * scale;
  return labels.map((label, i) => {
    const trend = 1 + i * 0.012;
    const wobble = 0.85 + rand() * 0.3;
    return { label, engagement: Math.round(baseEngagement * trend * wobble), reach: Math.round(baseReach * trend * (0.85 + rand() * 0.3)) };
  });
}

// ── 3. Audience insights ──
const AUDIENCE_LOCATIONS = [

  const values = HEATMAP_DAYS.map(() =>
    Array.from({ length: 24 }, (_, hour) => {

      return Math.round(Math.min(100, peak * 100 * (0.6 + rand() * 0.5)));

  const followerBase = network === 'all' ? 48200 : Math.round(48200 * NETWORK_WEIGHT[network]);
  const followerSeries = ['Jan','Feb','Mar','Apr','May','Jun'].map((label, i) => ({ label, value: Math.round(followerBase * (1 + i * 0.06)) }));
  const topGender = network === 'linkedin' ? { label:'Men', pct:56 } : { label:'Women', pct:61 };
  return { locations: AUDIENCE_LOCATIONS, ageRanges: AUDIENCE_AGES, topGender, heatmap: { days: HEATMAP_DAYS, hourLabels: HEATMAP_HOUR_LABELS, values }, followerSeries };
}

// ── 6. Cross-channel followers (sample rosters + full matcher) ──
const SAMPLE_FOLLOWER_ROSTERS = {

// --- matcher (ported from lib/analytics/cross-channel.ts) ---
const WEIGHTS = { handle:0.45, name:0.35, bio:0.2 };
const MATCH_THRESHOLD = 0.7;
const HIGH_CONFIDENCE = 0.85;
const STOPWORDS = new Set(['the','and','for','with','your','you','our','are','was','this','that','from','has','have','all','who','her','his','their','them','out','get','one','via','about','into','over','than','then']);
function normalizeHandle(h){ return h.toLowerCase().replace(/^@+/,'').replace(/[^a-z0-9]/g,''); }
function normalizeName(n){ return n.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function bioTokens(bio){
  const words = bio.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').split(/[^a-z0-9]+/).filter(w => w.length > 2 && !STOPWORDS.has(w));
  return new Set(words);
}
function editDistance(a,b){
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for (let i=1;i<=a.length;i++){
    const curr=[i];
    for (let j=1;j<=b.length;j++){
      const cost = a[i-1]===b[j-1]?0:1;
      curr[j] = Math.min(prev[j]+1, curr[j-1]+1, prev[j-1]+cost);
    }
    prev = curr;
  }
  return prev[b.length];
}
function stringSimilarity(a,b){ if(!a&&!b)return 1; if(!a||!b)return 0; return 1 - editDistance(a,b)/Math.max(a.length,b.length); }
function jaccard(a,b){ if(!a.size||!b.size)return 0; let inter=0; for(const w of a) if(b.has(w)) inter++; const union=a.size+b.size-inter; return union===0?0:inter/union; }
function scorePair(x,y){
  const handleSim = stringSimilarity(x.handle,y.handle);
  const nameSim = stringSimilarity(x.name,y.name);
  const bioInformative = x.tokens.size>0 && y.tokens.size>0;
  const bioSim = bioInformative ? jaccard(x.tokens,y.tokens) : 0;
  let contributions;
  if (bioInformative) {
    contributions = { handle:handleSim*WEIGHTS.handle, name:nameSim*WEIGHTS.name, bio:bioSim*WEIGHTS.bio };
  } else {
    const span = WEIGHTS.handle + WEIGHTS.name;
    contributions = { handle:(handleSim*WEIGHTS.handle)/span, name:(nameSim*WEIGHTS.name)/span, bio:0 };
  }
  return { score: contributions.handle+contributions.name+contributions.bio, contributions };
}
class UnionFind {
  constructor(size){ this.parent = Array.from({length:size},(_,i)=>i); }
  find(i){ while(this.parent[i]!==i){ this.parent[i]=this.parent[this.parent[i]]; i=this.parent[i]; } return i; }
  union(a,b){ const ra=this.find(a), rb=this.find(b); if(ra!==rb) this.parent[Math.max(ra,rb)]=Math.min(ra,rb); }
}
function confidenceLabel(s){ if(s>=HIGH_CONFIDENCE)return 'High'; if(s>=MATCH_THRESHOLD)return 'Medium'; return 'Low'; }
function letterCount(s){ return (s.match(/[a-z]/gi)||[]).length; }
function canonicalName(entries){
  return entries.map(e=>e.profile.name).reduce((best,name)=>{
    const bl=letterCount(best), nl=letterCount(name);
    if(nl>bl)return name; if(nl<bl)return best;
    if(name.length!==best.length)return name.length>best.length?name:best;
    return name<best?name:best;
  });
}
function matchCrossChannelFollowers(rosters){
  const entries=[];
  for (const roster of rosters)
    for (const profile of roster.followers)
      entries.push({ platform:roster.platform, profile, handle:normalizeHandle(profile.handle), name:normalizeName(profile.name), tokens:bioTokens(profile.bio) });
  const uf = new UnionFind(entries.length);
  const edges=[];
  for (let i=0;i<entries.length;i++) for (let j=i+1;j<entries.length;j++){
    if (entries[i].platform===entries[j].platform) continue;
    const { score, contributions } = scorePair(entries[i],entries[j]);
    if (score>=MATCH_THRESHOLD){ edges.push({a:i,b:j,score,contributions}); uf.union(i,j); }
  }
  const groups = new Map();
  for (let i=0;i<entries.length;i++){ const root=uf.find(i); (groups.get(root)||groups.set(root,[]).get(root)).push(i); }
  const people=[];
  for (const memberIdx of groups.values()){
    if (memberIdx.length<2) continue;
    const memberSet=new Set(memberIdx);
    const platforms=Array.from(new Set(memberIdx.map(i=>entries[i].platform)));
    if (platforms.length<2) continue;
    const groupEdges = edges.filter(e=>memberSet.has(e.a)&&memberSet.has(e.b));
    const avgScore = groupEdges.reduce((s,e)=>s+e.score,0)/groupEdges.length;
    const totals={handle:0,name:0,bio:0};
    for (const e of groupEdges){ totals.handle+=e.contributions.handle; totals.name+=e.contributions.name; totals.bio+=e.contributions.bio; }
    const strongestSignal = ['handle','name','bio'].reduce((best,sig)=> totals[sig]>totals[best]?sig:best);
    const members = memberIdx.map(i=>entries[i]);
    const accounts = members.map(e=>({ platform:e.platform, handle:e.profile.handle, name:e.profile.name, bio:e.profile.bio }));
    const confidence = Math.round(avgScore*10000)/10000;
    people.push({
      id: members.map(e=>`${e.platform}:${e.handle}`).sort().join('+'),
      canonicalName: canonicalName(members), accounts, platforms,
      confidence, confidenceLabel: confidenceLabel(confidence), strongestSignal,
    });
  }
  people.sort((a,b)=> b.platforms.length-a.platforms.length || b.confidence-a.confidence || a.canonicalName.localeCompare(b.canonicalName));
  return people;
}

/* ===========================================================================

   =========================================================================== */
function formatCompact(v){ if(Math.abs(v)>=1e6)return (v/1e6).toFixed(1)+'M'; if(Math.abs(v)>=1e3)return (v/1e3).toFixed(1)+'K'; return ''+v; }
function formatPercent(v,d=1){ return v.toFixed(d)+'%'; }
function formatCurrency(v){ return '$'+v.toLocaleString('en-US'); }
function formatDelta(v){ return (v>0?'+':'')+v.toFixed(1)+'%'; }
function sourceSuffix(s){ return s==='live'?'(live)':s==='mixed'?'(live + mock)':s==='empty'?'(not connected)':'(mock)'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function lineChart(labels, series){
  const all = series.flatMap(s => s.values);
  const max = Math.max(1, ...all);
  const n = Math.max(1, labels.length - 1);
  const x = i => (i/n)*100;
  const y = v => 100 - (v/max)*100;
  const polylines = series.map(s => {
    const pts = s.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    return `<polyline data-series="${esc(s.label)}" points="${pts}" fill="none" stroke="currentColor" stroke-width="0.8" vector-effect="non-scaling-stroke" />`;
  }).join('');
  const legend = series.map(s=>`<span class="legend-item">${esc(s.label)}</span>`).join('');
  return `<div class="line-chart">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Trend chart">${polylines}</svg>
    <div class="chart-axis"><span>${esc(labels[0])}</span><span>${esc(labels[Math.floor(labels.length/2)])}</span><span>${esc(labels[labels.length-1])}</span></div>
    <div class="chart-legend">${legend}</div>
  </div>`;
}

function barRow(label, value, max, suffix){
  const pct = Math.min(100, (value/max)*100);

function columnChart(data){
  const max = Math.max(1, ...data.map(d=>d.value));
  return `<div class="col-chart">` + data.map(d=>`<div class="col" data-label="${esc(d.label)}" title="${esc(d.label)}: ${d.value.toLocaleString()}"><span style="height:${(d.value/max)*100}%"></span><span class="col-label">${esc(d.label)}</span></div>`).join('') + `</div>`;
}
function heatmap(hm){
  const rows = hm.values.map((row,d)=>`<div class="heatmap-row"><span class="heatmap-day">${esc(hm.days[d])}</span><span class="heatmap-cells">${
    row.map((intensity,h)=>`<span title="${esc(hm.days[d])} ${h}:00 — ${intensity}" style="background:rgba(0,0,0,${(0.06+(Math.min(100,Math.max(0,intensity))/100)*0.74).toFixed(3)})"></span>`).join('')
  }</span></div>`).join('');
  const axis = `<div class="heatmap-axis">${hm.hourLabels.map(h=>`<span>${esc(h)}</span>`).join('')}</div>`;
  return `<div class="heatmap">${rows}${axis}</div>`;
}

  } else {
    const input = getRoiAttribution('all');
    const rows = state.network==='all' ? input : input.filter(r=>r.platform===state.network);
    const totals = rows.reduce((a,r)=>({clicks:a.clicks+r.clicks, conversions:a.conversions+r.conversions, revenue:a.revenue+r.revenue}),{clicks:0,conversions:0,revenue:0});
    const bodyRows = rows.map(r=>`<tr>
      <td><span class="roi-caption">${esc(r.caption)}</span></td>
      <td>${esc(NETWORK_LABEL[r.platform])}</td>
      <td><span class="utm-pill">${esc(r.utmCampaign)}</span></td>
      <td class="num">${formatCompact(r.clicks)}</td>
      <td class="num">${r.conversions}</td>
      <td class="num revenue">${formatCurrency(r.revenue)}</td>
    </tr>`).join('') || `<tr><td colspan="6" class="empty-inline">No attributed revenue for this network yet.</td></tr>`;
    const footer = rows.length ? `<tfoot><tr><td colspan="3">Total</td><td class="num">${formatCompact(totals.clicks)}</td><td class="num">${totals.conversions}</td><td class="num revenue">${formatCurrency(totals.revenue)}</td></tr></tfoot>` : '';
    body = `<table class="roi-table"><thead><tr><th>Campaign</th><th>Network</th><th>UTM campaign</th><th class="num">Clicks</th><th class="num">Conversions</th><th class="num">Revenue</th></tr></thead><tbody>${bodyRows}</tbody>${footer}</table>`;
  }
  sec('roi').innerHTML = sectionHead('ROI &amp; conversion attribution', `UTM via GA4 + revenue ${sourceSuffix(src)}`,
    'UTM-tagged clicks, conversions, and revenue attributed back to the campaign that drove them.') + body;
}

/* ── 9. Custom report builder ── */
function renderReport(){
  const widgets = REPORT_WIDGETS.map(w=>`<label class="report-widget" data-enabled="${state.reportEnabled[w.id]}">
    <input type="checkbox" data-widget="${w.id}" ${state.reportEnabled[w.id]?'checked':''} />
    <span class="widget-grip" aria-hidden="true">⠿</span>
    <span class="widget-label">${esc(w.label)}</span>
  </label>`).join('');
  const exports = EXPORT_FORMATS.map(fmt=>`<button type="button" class="export-btn" data-format="${fmt}" disabled title="Export coming soon">Export as ${fmt}</button>`).join('');
  const body = `<div class="report-grid">
    <div class="report-widgets"><h3>Widgets</h3><p>Choose what appears in the exported report.</p>${widgets}</div>
    <div class="report-export"><h3>Export</h3><p>Download a snapshot of the selected widgets.</p>${exports}
      <label class="whitelabel"><span>White-label branding <small>Hide Tala logo on exports</small></span>
        <input type="checkbox" data-control="whiteLabel" ${state.whiteLabel?'checked':''} /></label>
    </div>
  </div>`;
  sec('report').innerHTML = sectionHead('Custom report builder', 'User config (mock) — export renders server-side',
    'Toggle the widgets to include, add your branding, and export. Drag-and-drop ordering and export are mocked for now.') + body;
}

/* ── 10. Social listening (plan-gated) ── */
function renderListening(){
  const unlocked = canUseSocialListening(state.plan);
  const src = unlocked ? sectionSource() : 'empty';
  let body;
  if (!unlocked){
    body = `<div class="listening-locked">
      <p class="lock-title">Available on ${LISTENING_TIER_NAMES}</p>
      <p>Social listening &amp; sentiment is an enterprise feature. Upgrade to monitor brand mentions and track sentiment across the web.</p>
      <a class="upgrade-cta" href="#plan">Upgrade</a>
    </div>`;
  } else {
    const data = allowMock() ? getSocialListening(state.network) : null;
    if (!data){
      body = emptyState('Social listening requires a brand-monitoring integration (not connected yet).');
    } else {
      const up = data.deltaPct >= 0;
      const sentimentBar = `<div class="sentiment-bar">
        <span class="seg" data-sentiment="positive" style="width:${data.sentiment.positive}%"></span>
        <span class="seg" data-sentiment="neutral" style="width:${data.sentiment.neutral}%"></span>
        <span class="seg" data-sentiment="negative" style="width:${data.sentiment.negative}%"></span>
      </div>`;
      const sentimentLegend = ['positive','neutral','negative'].map(k=>`<span class="sentiment-stat" data-sentiment="${k}">${data.sentiment[k]}% ${k}</span>`).join('');
      const mentions = data.mentions.map(m=>`<div class="mention-row" data-sentiment="${m.sentiment}"><p class="mention-text">${esc(m.text)}</p><p class="mention-meta">${esc(m.author)} · ${esc(m.source)} · ${esc(m.at)}</p></div>`).join('');
      body = `<div class="listening-grid">
        <div class="listening-card" data-card="mentions"><div class="kpi-label">Total mentions</div><div class="kpi-value">${formatCompact(data.totalMentions)}</div>
          <div class="kpi-delta" data-direction="${up?'up':'down'}">${formatDelta(data.deltaPct)} vs last period</div>
          <div class="sov">${data.shareOfVoicePct}% share of voice</div></div>
        <div class="listening-card" data-card="sentiment"><h3>Sentiment</h3>${sentimentBar}<div class="sentiment-legend">${sentimentLegend}</div></div>
        <div class="listening-card" data-card="recent"><h3>Recent mentions</h3>${mentions}</div>
      </div>`;
    }
  }
  sec('listening').innerHTML = sectionHead('Social listening &amp; sentiment', `Listening provider + Claude sentiment ${sourceSuffix(src)}`,
    'Brand-mention monitoring and sentiment across the web.')
    + `<div class="listening-tier">Enterprise · ${LISTENING_TIER_NAMES}</div>` + body;
}

/* ── Full render ── */
function render(){
  renderHeaderAndBanner();
  renderNetworkFilter();
  renderCore();
  renderTop();
  renderPosts();
  renderAudience();
  renderCross();
  renderBestTimes();
  renderCompetitors();
  renderRoi();
  renderReport();
  renderListening();
}

/* ===========================================================================
   EVENT WIRING (delegated)
   =========================================================================== */
document.getElementById('app').addEventListener('click', e=>{
  const netBtn = e.target.closest('[data-network]');
  if (netBtn){ state.network = netBtn.dataset.network; render(); return; }

  const sortBtn = e.target.closest('[data-sort]');
  if (sortBtn){
    const key = sortBtn.dataset.sort;
    if (key === state.sortKey) state.sortDesc = !state.sortDesc;
    else { state.sortKey = key; state.sortDesc = true; }
    renderPosts();
    return;
  }
});

document.getElementById('app').addEventListener('change', e=>{
  const t = e.target;
  if (t.dataset.control === 'dataSource'){ state.dataSource = t.value; render(); return; }
  if (t.dataset.control === 'plan'){ state.plan = t.value; render(); return; }
  if (t.dataset.control === 'whiteLabel'){ state.whiteLabel = t.checked; return; }
  if (t.dataset.widget){ state.reportEnabled[t.dataset.widget] = t.checked; renderReport(); return; }
});

render();
</script>
</body>
</html>
